version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: github_dashboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 5678
      POSTGRES_DB: github_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: github_dashboard_backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:5678@postgres:5432/github_dashboard?schema=public
      JWT_SECRET: super-secret-key
      PORT: 4000
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    ports:
      - "4000:4000"
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: github_dashboard_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
